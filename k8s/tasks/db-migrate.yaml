# one-shot task: alembic migrations, run before the rolling update by run_migrations
apiVersion: v1
kind: Pod
metadata:
  name: db-migrate
  labels: { app: db-migrate, tier: migration }
spec:
  restartPolicy: Never  # a task runs once, it is never restarted
  containers:
    - name: migrate
      image: BACKEND_IMAGE  # replaced by the new backend image, so the migrations match the code
      imagePullPolicy: IfNotPresent
      command: ["alembic", "upgrade", "head"]
      env:
        - name: DATABASE_URL
          value: postgresql+psycopg://postgres@citus-coordinator:5432/photos
      resources:
        requests: { cpu: 20m, memory: 32Mi }
        limits:   { cpu: 500m, memory: 256Mi }
