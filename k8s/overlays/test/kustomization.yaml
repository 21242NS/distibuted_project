# test: Docker Desktop, images from GHCR, http://test.photos.localhost
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: test                         
resources:
  - namespace.yaml
  - ../../base
  - servicemonitor.yaml  # Prometheus scraping of the backend
components:
  - ../../components/citus
patches:
  - path: ingress-patch.yaml  # change the ingress host
    target:
      kind: Ingress
      name: photos