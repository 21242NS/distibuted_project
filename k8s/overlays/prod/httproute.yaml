apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: team3-routes
  namespace: team3
spec:
  parentRefs:
    - name: main-gateway
      namespace: infra
  hostnames:
    - team3.laboinfo-ecam.be
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }   # le chemin le plus long est prioritaire
      backendRefs:
        - name: backend
          port: 8000
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: frontend
          port: 80