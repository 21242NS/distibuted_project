apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team3
resources:
  - ../../base
  - httproute.yaml
components:
  - ../../components/citus
patches:
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: photos
  - patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: backend
  - patch: |-
      - op: add
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: backend
images:
  - name: photo-backend
    newName: ghcr.io/21242ns/photo-backend
  - name: photo-frontend
    newName: ghcr.io/21242ns/photo-frontend