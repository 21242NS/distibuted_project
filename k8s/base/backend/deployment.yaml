apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  # pas de "replicas" : c'est l'HPA (hpa.yaml) qui décide du nombre de pods
  selector:
    matchLabels:
      app: backend                     
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0                
      maxSurge: 1
  template:                            
    metadata:
      labels:
        app: backend                   
    spec:
      containers:
        - name: backend
          image: photo-backend:v1      
          imagePullPolicy: IfNotPresent  
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:              # prêt à recevoir du trafic ?
            httpGet:
              path: /api/ready
              port: 8000
            periodSeconds: 5
          livenessProbe:               # toujours vivant ? sinon redémarrage
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }