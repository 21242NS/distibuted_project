apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  selector:
    matchLabels:
      app: backend                     
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0                
      maxSurge: 1
  template:                            
    metadata:
      labels:
        app: backend                   
    spec:
      containers:
        - name: backend
          image: photo-backend:v1      
          imagePullPolicy: IfNotPresent  
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits:   { cpu: 250m, memory: 256Mi }