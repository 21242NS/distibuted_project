# headless service: stable DNS name citus-coordinator-0.citus-coordinator
apiVersion: v1
kind: Service
metadata:
  name: citus-coordinator
  labels: { app: citus-coordinator, tier: database }  # tier=database is applied first by deploy_database
spec:
  clusterIP: None  # headless, required by the StatefulSet
  selector: { app: citus-coordinator }
  ports:
    - name: postgres
      port: 5432
---
# Citus coordinator: receives the queries and routes them to the shards on the workers
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: citus-coordinator
  labels: { app: citus-coordinator, tier: database }
spec:
  serviceName: citus-coordinator
  replicas: 1  # one coordinator
  selector:
    matchLabels: { app: citus-coordinator }
  template:
    metadata:
      labels: { app: citus-coordinator, tier: database }
    spec:
      containers:
        - name: postgres
          image: citusdata/citus:alpine@sha256:982a8483148d62b7d0dfaf3014f341543f53078e94dc47241a19b4fcc2391e00
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - { name: POSTGRES_DB, value: photos }
            - { name: POSTGRES_HOST_AUTH_METHOD, value: trust }  # no password, the database is only reachable inside the cluster
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }  # subfolder, the volume root contains lost+found
          readinessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "photos"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "photos"] }
            initialDelaySeconds: 30  # leave time for PostgreSQL recovery after a restart
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:  # one persistent volume per pod, kept when the pod is recreated
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }  # 1 GiB per node
