# headless service: stable DNS names citus-worker-<n>.citus-workers
apiVersion: v1
kind: Service
metadata:
  name: citus-workers
  labels: { app: citus-worker, tier: database }
spec:
  publishNotReadyAddresses: true  # DNS names exist before the pods are ready, needed to register them
  clusterIP: None
  selector: { app: citus-worker }
  ports:
    - name: postgres
      port: 5432
---
# Citus workers: store the shards, each shard is replicated on 2 workers
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: citus-worker
  labels: { app: citus-worker, tier: database }
spec:
  serviceName: citus-workers
  replicas: 2  # two workers, matches shard_replication_factor = 2
  selector:
    matchLabels: { app: citus-worker }
  template:
    metadata:
      labels: { app: citus-worker, tier: database }
    spec:
      containers:
        - name: postgres
          image: citusdata/citus:alpine@sha256:982a8483148d62b7d0dfaf3014f341543f53078e94dc47241a19b4fcc2391e00
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - { name: POSTGRES_DB, value: photos }
            - { name: POSTGRES_HOST_AUTH_METHOD, value: trust }  # no password, the database is only reachable inside the cluster
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }  # subfolder, the volume root contains lost+found
          readinessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "photos"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "photos"] }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:  # one persistent volume per pod, kept when the pod is recreated
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
