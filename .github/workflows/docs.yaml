name: Documentation
on: # Trigger workflow when the docs change on main, or manually
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions: # Set permissions for the workflow
  contents: read
  pages: write
  id-token: write

concurrency:  # only the latest docs build is deployed
  group: pages
  cancel-in-progress: true

jobs:
  build: # Build the documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict  # fail on broken links
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy: # Deploy the documentation site
    needs: build
    runs-on: ubuntu-latest
    environment:  # GitHub Pages target
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
