name: CI/CD                         
on:                                 
  push:
    branches: [main]                
    paths-ignore:                   
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: [main]                
  workflow_dispatch:                
concurrency:
  group: deploy-test
  cancel-in-progress: false

permissions:
  contents: read
  packages: write                   # pousser les images sur ghcr.io

jobs:
 
  tests:
    runs-on: ubuntu-latest         
    defaults:
      run:
        working-directory: backend  
    steps:
      - uses: actions/checkout@v4   

      - uses: actions/setup-python@v5   
        with:
          python-version: "3.12"        
          cache: pip                    
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies      
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests            
        run: pytest -v
  deploy-test:
    needs: tests                    
    if: github.event_name != 'pull_request'   
    runs-on: self-hosted            
    steps:
      - uses: actions/checkout@v4   

      - name: Build, push to GHCR, deploy & smoke test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # utilisé par deploy.sh pour docker login ghcr.io
        run: ./scripts/deploy.sh test "sha-${GITHUB_SHA::7}"
  deploy-prod:
    needs: deploy-test
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/promote_prod.sh "sha-${GITHUB_SHA::7}"
        