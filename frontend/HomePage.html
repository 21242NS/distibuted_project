<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Library</title>
    <link rel="stylesheet" href="css/Home.css">
</head>
<body>
    <header class="topbar">
        <span class="brand">Photo Library</span>
        <div id="session" class="session" hidden>
            <span>Connecté en tant que <strong id="session-user"></strong></span>
            <button type="button" id="logout" class="button button-ghost">Se déconnecter</button>
        </div>
    </header>

    <main class="layout">
        <section id="auth" class="card" aria-labelledby="auth-title">
            <h1 id="auth-title">Bienvenue</h1>

            <div class="tabs" role="tablist" aria-label="Authentification">
                <button type="button" role="tab" id="tab-login" class="tab" aria-selected="true" aria-controls="panel-login">Connexion</button>
                <button type="button" role="tab" id="tab-signup" class="tab" aria-selected="false" aria-controls="panel-signup" tabindex="-1">Inscription</button>
            </div>

            <div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div>

            <form id="panel-login" class="form" role="tabpanel" aria-labelledby="tab-login" novalidate>
                <div class="field">
                    <label for="login-username">Nom d'utilisateur</label>
                    <input id="login-username" name="username" type="text" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="login-password">Mot de passe</label>
                    <input id="login-password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="button button-primary">Se connecter</button>
            </form>

            <form id="panel-signup" class="form" role="tabpanel" aria-labelledby="tab-signup" novalidate hidden>
                <div class="field">
                    <label for="signup-username">Nom d'utilisateur</label>
                    <input id="signup-username" name="username" type="text" autocomplete="username" required
                           aria-describedby="signup-username-hint">
                    <p id="signup-username-hint" class="hint">3 à 20 caractères : lettres, chiffres ou _</p>
                </div>
                <div class="field">
                    <label for="signup-password">Mot de passe</label>
                    <input id="signup-password" name="password" type="password" autocomplete="new-password" required
                           aria-describedby="signup-password-hint">
                    <p id="signup-password-hint" class="hint">Au moins 8 caractères, dont une lettre et un chiffre</p>
                </div>
                <div class="field">
                    <label for="signup-confirm">Confirmer le mot de passe</label>
                    <input id="signup-confirm" name="confirm" type="password" autocomplete="new-password" required>
                </div>
                <button type="submit" class="button button-primary">Créer mon compte</button>
            </form>
        </section>

        <section id="welcome" class="card card-welcome" aria-labelledby="welcome-title" hidden>
            <h1 id="welcome-title">Bonjour <span id="welcome-user"></span></h1>
            <p>Vous êtes connecté à votre bibliothèque de photos.</p>
        </section>

        <section class="card card-status" aria-labelledby="status-title">
            <h2 id="status-title">État du service</h2>
            <p id="message" class="message">Chargement...</p>
            <button type="button" id="refresh" class="button button-ghost">Rappeler l'API</button>
        </section>
    </main>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
